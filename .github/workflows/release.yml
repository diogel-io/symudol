# The release PR and the tag (documentation/releasing.md). release-please keeps one release PR,
# "chore(release): <version>", open against master: it sets the version from the Conventional
# Commits merged since the last tag, bumps pubspec.yaml (and its build number) and writes
# CHANGELOG.md. Merging that PR is the release: this workflow then creates the v<version> tag and
# a draft GitHub release, closes the version's milestone, and runs the publish job (#89), which
# builds the signed AAB and APK, uploads a draft to Google Play and publishes the APK to Zapstore.
# The publish-release job then attaches the APK to the draft release and publishes it. Releases
# are immutable once published, so the APK has to go on while the release is still a draft. The
# secrets the publish job needs are listed in documentation/releasing.md.
#
# Run it by hand (workflow_dispatch, from master) to publish a tag that already exists, when a
# publish step failed after the tag was created. A re-run would use the workflow at the tag; this
# uses master's. release-please and the milestone are skipped; choose which stores to upload to.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v1.0.1
        required: true
        type: string
      play:
        description: Upload a draft to Google Play (leave off if this version is already there)
        required: true
        type: boolean
        default: false
      zapstore:
        description: Publish the APK to Zapstore
        required: true
        type: boolean
        default: true

# One release run at a time, queued rather than cancelled, so two quick merges to master cannot
# race each other into duplicate tags or releases.
concurrency:
  group: symudol-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master

  # The milestone named after the version (for example 1.0.0) is the release's scope. It is done
  # once the release exists. A missing milestone is not an error: not every release has one.
  close-milestone:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close the version's milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          number="$(gh api "repos/$GITHUB_REPOSITORY/milestones?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$VERSION\") | .number")"
          if [ -z "$number" ]; then
            echo "::notice::No open milestone named $VERSION; nothing to close."
            exit 0
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/milestones/$number" -f state=closed --silent
          echo "Closed milestone $VERSION (#$number)"

  # Builds the signed AAB and APK, uploads a draft to the Google Play track named by the PLAY_TRACK
  # repository variable, publishes the APK to Zapstore (diogel-io/symudol#89), and hands the APK
  # and its SHA-256 to the publish-release job. Runs only for a push that created a release; the
  # secrets it needs are scoped to this job and are cleaned up before any failure can leave them
  # on disk. A manual run publishes the given tag instead, and only from master.
  publish:
    needs: release-please
    if: >-
      ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')) }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:3.44.0
    permissions:
      contents: write
    outputs:
      apk_sha256: ${{ steps.apk-digest.outputs.sha256 }}
    env:
      # Non-secret configuration. The upload keystore's path lands in $GITHUB_ENV below: the
      # `runner` context is not available in job-level `env`, so it is computed in a step.
      SYMUDOL_UPLOAD_KEY_ALIAS: ${{ secrets.SYMUDOL_UPLOAD_KEY_ALIAS }}
      PLAY_TRACK: ${{ vars.PLAY_TRACK || 'internal' }}
      ZSP_SHA256: 1ef5373f8ecd9ba63d2c3fab98abb0d31b2244a2aac31b3749fb205c7d5f5b38
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || format('v{0}', needs.release-please.outputs.version) }}
    steps:
      # A manual run's tag is typed by hand: refuse anything but v<major>.<minor>.<patch> before
      # it reaches a command or a secret is decoded.
      - name: Check the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::$TAG is not a release tag like v1.0.1"
            exit 1
          fi

      - name: Set the keystore's job-local path
        run: echo "SYMUDOL_UPLOAD_STORE_FILE=$RUNNER_TEMP/symudol-upload.keystore" >> "$GITHUB_ENV"

      - name: Checkout the tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.TAG }}

      # The publisher check's helper comes from the commit this workflow runs from, not the tag:
      # a manual run publishes an older tag that may not have it (v1.0.1 doesn't).
      - name: Checkout the publisher check
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: tools/zapstore_publisher_npub.dart
          sparse-checkout-cone-mode: false

      - name: Write the upload keystore
        env:
          SYMUDOL_UPLOAD_KEYSTORE_BASE64: ${{ secrets.SYMUDOL_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$SYMUDOL_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$SYMUDOL_UPLOAD_STORE_FILE"
          chmod 600 "$SYMUDOL_UPLOAD_STORE_FILE"

      - name: Build the signed AAB
        env:
          SYMUDOL_UPLOAD_STORE_PASSWORD: ${{ secrets.SYMUDOL_UPLOAD_STORE_PASSWORD }}
          SYMUDOL_UPLOAD_KEY_PASSWORD: ${{ secrets.SYMUDOL_UPLOAD_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build appbundle --release

      - name: Build the signed APK
        env:
          SYMUDOL_UPLOAD_STORE_PASSWORD: ${{ secrets.SYMUDOL_UPLOAD_STORE_PASSWORD }}
          SYMUDOL_UPLOAD_KEY_PASSWORD: ${{ secrets.SYMUDOL_UPLOAD_KEY_PASSWORD }}
        run: flutter build apk --release

      # Writes android/local.properties for settings.gradle.kts without rebuilding.
      - name: Prepare Gradle
        run: flutter build apk --config-only

      # The release bundle and APK must be signed with the upload key recorded in
      # documentation/releasing.md; anything else stops here, before an upload is attempted.
      - name: Check the signer is the upload key
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          APK="build/app/outputs/flutter-apk/symudol.apk"
          digest="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | awk '/certificate SHA-256 digest/ {print $NF; exit}')"
          expected="e423ff9e656870f71d76c6033b441e0f00164b454b9d236ea2de38764a95aef9"
          if [ "$digest" != "$expected" ]; then
            echo "symudol.apk signer is not the upload key: $digest" >&2
            exit 1
          fi
          echo "symudol.apk signer verified as the upload key"

      # The publish-release job checks the APK it downloads against this digest.
      - name: Record the APK's SHA-256
        id: apk-digest
        run: |
          sha256="$(sha256sum build/app/outputs/flutter-apk/symudol.apk | awk '{print $1}')"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "symudol.apk SHA-256: $sha256"

      - name: Upload the draft to Google Play
        if: github.event_name == 'push' || inputs.play
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          SYMUDOL_UPLOAD_STORE_PASSWORD: ${{ secrets.SYMUDOL_UPLOAD_STORE_PASSWORD }}
          SYMUDOL_UPLOAD_KEY_PASSWORD: ${{ secrets.SYMUDOL_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew publishReleaseBundle --console=plain
        working-directory: android

      - name: Hand the signed APK to the publish-release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: symudol-apk
          path: build/app/outputs/flutter-apk/symudol.apk
          # A re-run of this job replaces the earlier attempt's artifact instead of failing on it.
          overwrite: true
          if-no-files-found: error
          retention-days: 7

      # zsp is pinned by version and checked against its released SHA-256 before it sees a secret.
      - name: Publish the APK to Zapstore
        if: github.event_name == 'push' || inputs.zapstore
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGNER_NSEC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # zsp 2 ignores zapstore.yaml's pubkey, so check here that the secret is the publisher
          # key it records; another key in the secret would otherwise publish under that key.
          expected="$(sed -n 's/^pubkey: *//p' zapstore.yaml)"
          actual="$(dart run --verbosity=error .release-tools/tools/zapstore_publisher_npub.dart)"
          if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
            echo "::error::ZAPSTORE_SIGNER_NSEC is not the publisher key in zapstore.yaml ($expected); it is $actual."
            exit 1
          fi
          echo "Zapstore publisher verified as $expected"
          curl -fsSL -o /tmp/zsp https://github.com/zapstore/zsp/releases/download/v2.0.1/zsp-2.0.1-linux-amd64
          echo "$ZSP_SHA256  /tmp/zsp" | sha256sum -c - >/dev/null
          chmod +x /tmp/zsp
          # zsp 2 has no -y; --quiet runs it without prompts or the browser preview.
          /tmp/zsp publish --quiet zapstore.yaml

      # Runner disks are ephemeral, but no run of this job leaves a keystore behind on any outcome.
      - name: Delete the upload keystore
        if: always()
        run: rm -f "$SYMUDOL_UPLOAD_STORE_FILE"

  # release-please creates the release as a draft (release-please-config.json), because a published
  # release is immutable and refuses new assets. This job runs last, after the Play and Zapstore
  # uploads: it attaches the signed APK to the draft and then publishes the release. If an earlier
  # step fails, the release stays a draft that only maintainers see; re-run the failed jobs, or
  # run this workflow by hand for the tag.
  publish-release:
    needs: [release-please, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || format('v{0}', needs.release-please.outputs.version) }}
    steps:
      - name: Download the signed APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: symudol-apk

      - name: Check the APK is the one the publish job built
        env:
          EXPECTED_SHA256: ${{ needs.publish.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          echo "$EXPECTED_SHA256  symudol.apk" | sha256sum -c -

      # A manual run for a release that is already published (to retry only a store upload, say)
      # leaves the release alone. On a push, a published release means the APK can never go on.
      - name: Check the release is still a draft
        id: draft
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            echo "draft=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::notice::Release $TAG is already published; leaving it as it is."
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Release $TAG is already published, and published releases are immutable, so symudol.apk cannot be attached."
            exit 1
          fi

      - name: Attach the signed APK to the draft release
        if: steps.draft.outputs.draft == 'true'
        run: gh release upload "$TAG" symudol.apk --clobber

      - name: Publish the GitHub release
        if: steps.draft.outputs.draft == 'true'
        run: gh release edit "$TAG" --draft=false

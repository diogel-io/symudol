org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Both off, as Flutter's own app template sets them (#148, #150). Flutter 3.44, the version CI pins,
# cannot build with built-in Kotlin (support came in Flutter 3.47.0), and the share_plus plugin still
# declares the Kotlin Gradle plugin; share_plus and url_launcher_android also use AGP's old DSL. So
# AGP warns that both flags are deprecated, and the Kotlin Gradle plugin warns on every project,
# until CI moves to Flutter 3.47 or newer and those plugins migrate.
android.builtInKotlin=false
android.newDsl=false
